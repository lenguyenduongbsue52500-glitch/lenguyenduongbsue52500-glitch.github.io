<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终末地公文｜V-NNC修复版</title>
<!-- 替换为 dom -->
<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.2.0/dist/dom-to-image-more.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei",sans-serif;}

#loader{
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#00ffc8;
    overflow:hidden;
}

#loader::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(to bottom, transparent 0%, rgba(0,255,200,0.12) 50%, transparent 100%);
    animation:loaderScan 2.4s linear infinite;
}
@keyframes loaderScan{
    0%{transform:translateY(-100%);}
    100%{transform:translateY(100%);}
}

.loader-hud-tl,.loader-hud-tr,.loader-hud-bl,.loader-hud-br{
    position:absolute;
    width:24px;height:24px;
    border:2px solid #00ffc8;
}
.loader-hud-tl{top:32px;left:32px;border-right:none;border-bottom:none;}
.loader-hud-tr{top:32px;right:32px;border-left:none;border-bottom:none;}
.loader-hud-bl{bottom:32px;left:32px;border-right:none;border-top:none;}
.loader-hud-br{bottom:32px;right:32px;border-left:none;border-top:none;}

.vnnc-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
}

.vnnc-char{
    font-size:48px;
    font-weight:800;
    color:#ffd56b;
    letter-spacing:4px;
    opacity:1;
    transform:translateY(0) scale(1);
    text-shadow:
        0 0 8px rgba(255,213,107,0.6),
        0 0 18px rgba(255,180,60,0.45),
        0 0 30px rgba(255,150,40,0.25);
    animation:vnncGoldFlicker 2.6s ease-in-out infinite;
}

@keyframes vnncGoldFlicker{
    0%,100%{
        color:#ffd56b;
        text-shadow:
            0 0 8px rgba(255,213,107,0.6),
            0 0 18px rgba(255,180,60,0.45),
            0 0 30px rgba(255,150,40,0.25);
    }
    50%{
        color:#fff4c4;
        text-shadow:
            0 0 14px rgba(255,244,196,0.9),
            0 0 26px rgba(255,210,120,0.7),
            0 0 42px rgba(255,170,60,0.45);
    }
}

.progress-wrap{
    width:320px;
    height:4px;
    border:1px solid rgba(0,255,200,0.4);
    border-radius:2px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#00ffc8;
    box-shadow:0 0 10px #00ffc8;
    transition: width 0.08s linear;
}
.load-info{
    margin-top:16px;
    font-size:13px;
    color:#9fd8ff;
    letter-spacing:2px;
    opacity:1;
}

.loader-fadeout{
    animation:loaderFade 0.8s forwards;
}
@keyframes loaderFade{
    0%{opacity:1;}
    100%{opacity:0;z-index:-1;visibility:hidden;}
}

body{
    background:
        radial-gradient(circle at top left, rgba(0,255,200,0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(0,180,255,0.12), transparent 40%),
        #05070d;
    color:#d6efff;
    padding:14px;
    background-image:
        linear-gradient(rgba(0,255,200,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,200,0.08) 1px, transparent 1px);
    background-size:24px 24px;
    position:relative;
    overflow-x:hidden;
    opacity:0;
    transition:opacity 0.8s ease;
}
body.show-ui{opacity:1;}

.container{
    max-width:1100px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 1fr;
    gap:18px;
}
.panel{
    background:linear-gradient(180deg, rgba(15,22,33,0.92), rgba(9,14,22,0.92));
    border:1px solid rgba(0,255,200,0.25);
    border-radius:14px;
    padding:18px;
    box-shadow:
        0 0 24px rgba(0,255,200,0.08),
        inset 0 0 24px rgba(0,180,255,0.05);
    position:relative;
    overflow:visible;
}
.panel .hud-tl,.panel .hud-tr,.panel .hud-bl,.panel .hud-br{
    position:absolute;
    width:18px;height:18px;
    border:2px solid #00ffc8;
    z-index:2;
}
.panel .hud-tl{top:0;left:0;border-right:none;border-bottom:none;}
.panel .hud-tr{top:0;right:0;border-left:none;border-bottom:none;}
.panel .hud-bl{bottom:0;left:0;border-right:none;border-top:none;}
.panel .hud-br{bottom:0;right:0;border-left:none;border-top:none;}

h1{
    font-size:20px;
    margin-bottom:6px;
    font-weight:800;
    letter-spacing:4px;
    color:#00ffc8;
    text-shadow:0 0 12px rgba(0,255,200,0.45);
    animation:glitch 4s infinite;
}
@keyframes glitch{
    0%,90%,100%{text-shadow:0 0 12px rgba(0,255,200,0.45);}
    92%{text-shadow:2px 0 #00b4ff,-2px 0 #ff3366;}
    94%{text-shadow:-2px 0 #00b4ff,2px 0 #ff3366;}
}
.subtitle{
    font-size:12px;
    color:#6fbfd6;
    letter-spacing:3px;
    margin-bottom:16px;
    opacity:0.8;
}
.form-item{margin-bottom:14px;}
.form-item label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    color:#7ee8d6;
    letter-spacing:2px;
}
.form-item input,.form-item textarea,.form-item select{
    width:100%;
    padding:10px 12px;
    background:rgba(10,18,28,0.85);
    border:1px solid rgba(0,255,200,0.35);
    border-radius:8px;
    color:#d6efff;
    font-size:14px;
    outline:none;
    transition:0.2s;
    caret-color:#00ffc8;
}
.form-item input:focus,.form-item textarea:focus,.form-item select:focus{
    border-color:#00ffc8;
    box-shadow:0 0 12px rgba(0,255,200,0.25);
}
textarea{min-height:150px;resize:vertical;}
.row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.row3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}
.btn-group{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:3px;
    font-weight:700;
    color:#05070d;
    background:linear-gradient(135deg,#00ffc8,#00b4ff);

}
@keyframes pulse{
    from{box-shadow:0 0 16px rgba(0,255,200,0.35);}
    to{box-shadow:0 0 24px rgba(0,255,200,0.6);}
}
button:hover{transform:translateY(-1px);}

/* ========== 预览区 ========== */
.preview-wrap{
    background:#fff;

}

/* 文号放到红线上方 */

    width:100%;

.doc-title{

.doc-body{

.doc-body p{

.level-one-title{

.doc-stamp{

    width:140px;

}

.stamp-date{

    color:#111;
}

.page-num{
    position:absolute;

    right:0;

    font-size:16px;

}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#0a1220;}
::-webkit-scrollbar-thumb{background:#00ffc8;border-radius:10px;}

@media (max-width:820px){

        width:100%;
        height:auto;

    }

<div id="downloadModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:9999;">

<script>
document.addEventListener('DOMContentLoaded', function(){
    const progressBar = document.getElementById("progressBar");
    const loadInfo = document.getElementById("loadInfo");
    const loader = document.getElementById("loader");
    const infoList = [
        "INITIALIZING SYSTEM...",
        "SCANNING DATABASE...",
        "VERIFYING ACCESS KEY...",
        "V-NNC CHANNEL ONLINE",
        "LOAD COMPLETE"
    ];
    let progress = 0;
    let timer;

    timer = setInterval(function(){
        progress += 1.2;
        if(progress >=100) progress = 100;
        progressBar.style.width = progress+"%";
        const step = Math.floor(progress / 20);
        if(step < infoList.length) loadInfo.innerText = infoList[step];

        if(progress ===100){
            clearInterval(timer);
            setTimeout(function(){
                loader.classList.add("loader-fadeout");
                document.body.classList.add("show-ui");
            }, 400);
        }
    },90);

    setTimeout(function(){
        clearInterval(timer);
        loader.classList.add("loader-fadeout");
        document.body.classList.add("show-ui");
    }, 4000);
});

function render(){
    document.getElementById("showRedHead").innerHTML = document.getElementById("redHead").value;
    document.getElementById("showRedCode").innerText = document.getElementById("redCode").value.trim();
    document.getElementById("showTitle").innerText = document.getElementById("docMainTitle").value.trim();
    document.getElementById("showStampCenter").innerText = document.getElementById("stampCenterTxt").value;
    document.getElementById("showStampOrg").innerText = document.getElementById("stampOrgText").value;
    document.getElementById("showStampDate").innerText = document.getElementById("stampEndDate").value;
    document.getElementById("showPageNum").innerText = document.getElementById("pageNumber").value;

    const stampEnabled = document.getElementById("stampEnabled").value;
    const stampWrap = document.getElementById("stampWrap");
    if(stampEnabled === "off"){
        stampWrap.classList.add("hide");
    }else{
        stampWrap.classList.remove("hide");
    }

    let raw = document.getElementById("docText").value.trim();
    raw = raw.replace(/【大】([\s\S]*?)【\/大】/g,'<span class="big-text">$1</span>');
    const blocks = raw.split(/\n\n+/).filter(item => item.trim() !== "");
    let html = "";
    blocks.forEach(function(b){
        const line = b.trim();
        if(line.startsWith("＝ ")){
            html += `<div class="level-one-title">${line}</div>`;
        }
        else if(/^（[\u4e00-\u9fa5]）/.test(line)){
            html += `<div class="level-two-title">${line}</div>`;
        }
        else{
            html += `<p>${line}</p>`;
        }
    });
    document.getElementById("showBody").innerHTML = html;
}

let currentBlob = null;
let currentFileName = "";

// 使用 dom-to-image-more toBlob，原生Blob输出
async function saveImage(){
    const node = document.getElementById("exportDom");
    const blob = await domtoimage.toBlob(node, {quality:1});
    saveAs(blob, getFileName() + ".png");
}

async function openDownloadModal(){
    const node = document.getElementById("exportDom");
    // 生成Blob，不再使用html2canvas
    const blob = await domtoimage.toBlob(node, {quality:1});
    currentBlob = blob;
    currentFileName = getFileName();

    document.getElementById("modalFileName").innerText = currentFileName;
    document.getElementById("modalFileSize").innerText = "文件大小：" + (blob.size / 1024).toFixed(1) + " KB";
    document.getElementById("downloadModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("downloadModal").style.display = "none";
}

function confirmDownload(){
    saveAs(currentBlob, currentFileName + ".png");
    closeModal();
}

async function copyBlobLink(){
    try{
        const url = URL.createObjectURL(currentBlob);
        await navigator.clipboard.writeText(url);
        alert("Blob链接已复制");
    }catch(e){
        alert("复制失败");
    }
}

function getFileName(){
    const alias = document.getElementById("codeAlias").value;
    const year = document.getElementById("signDate").value.split("/")[0];
    const no = document.getElementById("docId").value;
    const title = document.getElementById("docMainTitle").value;
    return `${alias}〔${year}〕${no}号 ${title}`;
}

const inputs = document.querySelectorAll(
    "#redHead,#redCode,#docMainTitle,#docText,#stampCenterTxt,#stampOrgText,#stampEndDate,#pageNumber,#stampEnabled"
);
inputs.forEach(function(el){
    el.addEventListener("input", render);
    el.addEventListener("change", render);
});
render();
</script>

</body>
</html>
